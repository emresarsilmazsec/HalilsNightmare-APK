plugins { id 'com.android.application' }
android {
    namespace 'com.halil.nightmare'
    compileSdk 34
    defaultConfig {
        applicationId 'com.halil.nightmare'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        // Sabit imza: yeni sürümler eskisinin üzerine kurulur, ilerleme silinmez.
        harbio { storeFile file('harbio.keystore'); storePassword 'harbio123'; keyAlias 'harbio'; keyPassword 'harbio123' }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.harbio }
        debug { signingConfig signingConfigs.harbio }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
