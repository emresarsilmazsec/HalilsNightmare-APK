name: APK derle
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Oyun dosyalarini APK'ya kopyala
        run: |
          mkdir -p android/app/src/main/assets
          cp -r oyun/* android/app/src/main/assets/
          ls -la android/app/src/main/assets android/app/src/main/assets/sesler | head -50
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK derle
        working-directory: android
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: HalilsNightmare-apk, path: android/app/build/outputs/apk/release/*.apk }
